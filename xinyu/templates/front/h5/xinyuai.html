<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>心语AI</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background:#f5f5f5; height:100vh; display:flex; flex-direction:column; }

/* 顶部导航 */
.header { background:linear-gradient(135deg,#4eb3a6,#0e9488); color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.header .back { font-size:20px; cursor:pointer; padding:4px 8px; }
.header .title { font-size:17px; font-weight:600; }
.header .clear-btn { font-size:13px; background:rgba(255,255,255,.2); border:none; color:#fff; padding:5px 12px; border-radius:14px; cursor:pointer; }

/* 风险预警条 */
.risk-bar { display:none; background:#FEF2F2; border-bottom:1px solid #FECACA; color:#DC2626; padding:10px 16px; font-size:13px; line-height:1.5; }
.risk-bar.show { display:block; }
.risk-bar strong { color:#B91C1C; }

/* 消息区域 */
.chat-area { flex:1; overflow-y:auto; padding:16px 12px; -webkit-overflow-scrolling:touch; }
.msg { display:flex; margin-bottom:16px; align-items:flex-start; }
.msg.user { flex-direction:row-reverse; }
.msg .avatar { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.msg.ai .avatar { background:linear-gradient(135deg,#4eb3a6,#0e9488); color:#fff; margin-right:8px; }
.msg.user .avatar { background:#E5E7EB; color:#6B7280; margin-left:8px; }
.msg .bubble { max-width:75%; padding:10px 14px; border-radius:16px; font-size:15px; line-height:1.6; word-break:break-word; white-space:pre-wrap; }
.msg.ai .bubble { background:#fff; color:#333; border-top-left-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
.msg.user .bubble { background:linear-gradient(135deg,#4eb3a6,#0e9488); color:#fff; border-top-right-radius:4px; }
.msg .bubble.danger { border:1px solid #FECACA; background:#FEF2F2; }
.msg .time { font-size:11px; color:#999; margin-top:4px; }
.msg.user .time { text-align:right; }

/* 欢迎语 */
.welcome { text-align:center; color:#9CA3AF; font-size:14px; padding:40px 20px; line-height:1.8; }
.welcome .icon { font-size:48px; margin-bottom:12px; }

/* 底部输入 */
.input-area { background:#fff; border-top:1px solid #E5E7EB; padding:10px 12px; display:flex; align-items:center; gap:8px; flex-shrink:0; padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
.input-area input { flex:1; border:1px solid #E5E7EB; border-radius:22px; padding:10px 16px; font-size:15px; outline:none; background:#F9FAFB; }
.input-area input:focus { border-color:#0e9488; background:#fff; }
.input-area button { background:linear-gradient(135deg,#4eb3a6,#0e9488); color:#fff; border:none; border-radius:22px; padding:10px 20px; font-size:15px; cursor:pointer; white-space:nowrap; }
.input-area button:disabled { opacity:.5; }

/* 加载动画 */
.typing { display:flex; gap:4px; padding:4px 0; }
.typing span { width:7px; height:7px; background:#9CA3AF; border-radius:50%; animation:blink 1.4s infinite; }
.typing span:nth-child(2) { animation-delay:.2s; }
.typing span:nth-child(3) { animation-delay:.4s; }
@keyframes blink { 0%,60%,100%{opacity:.3;} 30%{opacity:1;} }

/* 危机提示卡片 */
.crisis-card { background:#FEF2F2; border:1px solid #FECACA; border-radius:12px; padding:12px 14px; margin-top:8px; font-size:13px; color:#991B1B; line-height:1.6; }
.crisis-card .hotline { font-weight:600; font-size:15px; color:#DC2626; }
</style>
</head>
<body>

<div class="header">
  <span class="back" onclick="goBack()">&#8249;</span>
  <span class="title">心语AI</span>
  <button class="clear-btn" onclick="clearChat()">清空对话</button>
</div>

<div class="risk-bar" id="riskBar">
  <strong>安全提醒：</strong>检测到您的消息中可能包含自我伤害相关内容。如果您正在经历心理危机，请立即拨打
  <strong>全国心理援助热线：400-161-9995</strong>，或联系身边的信任的人、前往最近的医院急诊。
</div>

<div class="chat-area" id="chatArea">
  <div class="welcome" id="welcome">
    <div class="icon">&#128171;</div>
    <div>你好，我是心语AI</div>
    <div>一个温暖的倾听者</div>
    <div style="margin-top:8px;font-size:13px;">有什么心事，都可以跟我说</div>
  </div>
</div>

<div class="input-area">
  <input type="text" id="msgInput" placeholder="说说你的感受..." maxlength="500" onkeydown="if(event.key==='Enter')sendMsg()">
  <button id="sendBtn" onclick="sendMsg()">发送</button>
</div>

<script>
var API_BASE = '/xinyu/xinyuai';
var token = localStorage.getItem('appToken') || '';
var sending = false;

function getToken() {
  token = localStorage.getItem('appToken') || '';
  if (!token) {
    // 尝试从URL参数获取
    var m = location.search.match(/token=([^&]+)/);
    if (m) { token = m[1]; localStorage.setItem('appToken', token); }
  }
  return token;
}

function goBack() {
  if (history.length > 1) history.back();
  else location.href = 'index.html';
}

function addMsg(role, content, riskLevel, time) {
  var welcome = document.getElementById('welcome');
  if (welcome) welcome.style.display = 'none';

  var area = document.getElementById('chatArea');
  var div = document.createElement('div');
  div.className = 'msg ' + role;

  var avatar = role === 'ai' ? '&#129302;' : '&#128100;';
  var bubbleClass = 'bubble' + (riskLevel === 'crisis' || riskLevel === 'danger' ? ' danger' : '');
  var timeStr = time ? formatTime(time) : formatTime(new Date());

  var crisisHtml = '';
  if ((riskLevel === 'crisis' || riskLevel === 'danger') && role === 'user') {
    crisisHtml = '<div class="crisis-card">&#9888;&#65039; 检测到危机关键词，已通知心理医生关注<br>心理援助热线：<span class="hotline">400-161-9995</span></div>';
  }

  div.innerHTML =
    '<div class="avatar">' + avatar + '</div>' +
    '<div style="max-width:75%;">' +
      '<div class="' + bubbleClass + '">' + escapeHtml(content) + '</div>' +
      crisisHtml +
      '<div class="time">' + timeStr + '</div>' +
    '</div>';
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function addTyping() {
  var area = document.getElementById('chatArea');
  var div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typingMsg';
  div.innerHTML =
    '<div class="avatar">&#129302;</div>' +
    '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  var t = document.getElementById('typingMsg');
  if (t) t.remove();
}

function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function formatTime(d) {
  d = new Date(d);
  var h = String(d.getHours()).padStart(2,'0');
  var m = String(d.getMinutes()).padStart(2,'0');
  return h + ':' + m;
}

function sendMsg() {
  if (sending) return;
  var input = document.getElementById('msgInput');
  var msg = input.value.trim();
  if (!msg) return;
  if (!getToken()) { alert('请先登录'); location.href = 'index.html#/pages/login/login'; return; }

  input.value = '';
  addMsg('user', msg);
  sending = true;
  document.getElementById('sendBtn').disabled = true;
  addTyping();

  fetch(API_BASE + '/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Token': token },
    body: JSON.stringify({ message: msg })
  })
  .then(function(r){ return r.json(); })
  .then(function(j){
    removeTyping();
    sending = false;
    document.getElementById('sendBtn').disabled = false;
    if (j.code === 0) {
      addMsg('ai', j.data.reply);
      if (j.data.risk_level === 'crisis' || j.data.risk_level === 'danger') {
        document.getElementById('riskBar').classList.add('show');
      }
    } else if (j.code === 401) {
      localStorage.removeItem('appToken');
      alert('登录已过期，请重新登录');
      location.href = 'index.html#/pages/login/login';
    } else {
      addMsg('ai', j.msg || '出了点小问题，请稍后再试');
    }
  })
  .catch(function(e){
    removeTyping();
    sending = false;
    document.getElementById('sendBtn').disabled = false;
    addMsg('ai', '网络连接失败，请检查网络后重试');
  });
}

function clearChat() {
  if (!confirm('确定清空所有对话记录吗？')) return;
  if (!getToken()) return;
  fetch(API_BASE + '/clear', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Token': token }
  })
  .then(function(r){ return r.json(); })
  .then(function(j){
    if (j.code === 0) {
      document.getElementById('chatArea').innerHTML =
        '<div class="welcome" id="welcome"><div class="icon">&#128171;</div>' +
        '<div>你好，我是心语AI</div><div>一个温暖的倾听者</div>' +
        '<div style="margin-top:8px;font-size:13px;">有什么心事，都可以跟我说</div></div>';
      document.getElementById('riskBar').classList.remove('show');
    }
  });
}

function loadHistory() {
  if (!getToken()) return;
  fetch(API_BASE + '/history', { headers: { 'Token': token } })
  .then(function(r){ return r.json(); })
  .then(function(j){
    if (j.code === 0 && j.data.list.length > 0) {
      document.getElementById('welcome').style.display = 'none';
      j.data.list.forEach(function(m){
        addMsg(m.role, m.content, m.risk_level, m.time);
      });
      if (j.data.list.some(function(m){ return m.risk_level === 'crisis' || m.risk_level === 'danger'; })) {
        document.getElementById('riskBar').classList.add('show');
      }
    }
  })
  .catch(function(){});
}

getToken();
loadHistory();
</script>
</body>
</html>
